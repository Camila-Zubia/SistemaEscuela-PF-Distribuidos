# Nombre y puerto del servicio (ver docs/contrato-api.md para la tabla de puertos)
quarkus.application.name=servicio-plantilla
quarkus.http.port=8099

# Conexion a RabbitMQ (la lee RabbitConfig de escuela-common desde variables de entorno;
# estos son los valores por defecto del docker-compose)
# RABBITMQ_HOST=localhost  RABBITMQ_PORT=5672  RABBITMQ_USER=escuela  RABBITMQ_PASS=escuela

# Cuando el servicio use base de datos (Panache), agrega quarkus-hibernate-orm-panache
# y quarkus-jdbc-postgresql al pom y descomenta:
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=escuela
# quarkus.datasource.password=escuela
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/plantilla
# quarkus.hibernate-orm.database.generation=update
