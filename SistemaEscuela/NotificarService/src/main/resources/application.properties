quarkus.application.name=notificar-service
quarkus.http.port=8083

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=escuela
quarkus.datasource.password=escuela
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/notificar
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update

notificar.reglas.calificacion-minima=6
notificar.reglas.descenso-minimo=1.5
notificar.reglas.tareas-omitidas=3

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:notificar;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.http.test-port=0
%test.notificar.consumidor.habilitado=false
%test.notificar.publicador.habilitado=false
