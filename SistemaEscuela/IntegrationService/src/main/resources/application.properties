# Configuracion IntegrationService
quarkus.application.name=integration-service
quarkus.http.port=8084

# Cliente REST hacia MoodleMock
quarkus.rest-client.moodle-api.url=http://localhost:8091
quarkus.rest-client.moodle-api.connect-timeout=5000
quarkus.rest-client.moodle-api.read-timeout=5000

